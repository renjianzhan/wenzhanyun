<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>稳站云 - 登录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { width: 100%; max-width: 400px; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .btn-primary { background: #0066ff; border: none; }
        .btn-primary:hover { background: #0052cc; }
        .back-link { text-align: center; margin-top: 1rem; }
        .back-link a { color: #0066ff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2 class="text-center mb-4">欢迎回来</h2>
        <div class="mb-3">
            <input type="text" id="username" class="form-control" placeholder="用户名" required>
        </div>
        <div class="mb-3">
            <input type="password" id="password" class="form-control" placeholder="密码" required>
        </div>
        <button id="loginBtn" class="btn btn-primary w-100">登录</button>
        <div class="back-link"><a href="index.html">没有账号？去注册</a></div>
        <div id="msg" class="text-center mt-3" style="color:#666;"></div>
    </div>

    <script>
        document.getElementById('loginBtn').onclick = async () => {
            const msg = document.getElementById('msg');
            msg.innerText = '登录中...';
            msg.style.color = '#0066ff';
            
            try {
                const res = await fetch('/api/login', { 
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({ 
                        username: document.getElementById('username').value, 
                        password: document.getElementById('password').value 
                    }) 
                });
                const data = await res.json();
                msg.innerText = data.msg;
                msg.style.color = data.msg.includes('成功') ? '#52c41a' : '#ff4d4f';
                
                if (data.msg.includes('成功')) {
                    localStorage.setItem('wzy_username', data.username);
                    localStorage.setItem('wzy_token', data.token);
                    setTimeout(() => window.location.href = 'dashboard.html', 1000);
                }
            } catch(e) {
                msg.innerText = '登录失败: ' + e.message;
                msg.style.color = '#ff4d4f';
            }
        };
    </script>
</body>
</html>
