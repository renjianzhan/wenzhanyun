<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>稳站云 - 登录</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
</head>
<body class="hold-transition login-page">
<div class="login-box">
    <div class="card card-outline card-primary">
        <div class="card-header text-center"><h1><b>稳站云</b></h1></div>
        <div class="card-body">
            <p class="login-box-msg">登录您的代码空间</p>
            <form id="loginForm">
                <div class="input-group mb-3">
                    <input type="text" id="user" class="form-control" placeholder="用户名">
                    <div class="input-group-append"><div class="input-group-text"><i class="fas fa-user"></i></div></div>
                </div>
                <div class="input-group mb-3">
                    <input type="password" id="pass" class="form-control" placeholder="密码">
                    <div class="input-group-append"><div class="input-group-text"><i class="fas fa-lock"></i></div></div>
                </div>
                <button type="submit" class="btn btn-primary btn-block">登录</button>
            </form>
            <p class="mt-3 text-center">没有账号？<a href="/register.html">立即注册</a></p>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script>
$('#loginForm').on('submit', async (e) => {
    e.preventDefault();
    const res = await fetch('/api/user/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ username: $('#user').val(), password: $('#pass').val() })
    }).then(r => r.json());
    if (res.token) {
        localStorage.setItem('wzy_token', res.token);
        window.location.href = '/dashboard.html';
    } else {
        alert(res.error || '登录失败');
    }
});
</script>
</body>
</html>
