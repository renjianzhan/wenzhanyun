<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>稳站云 - 上传文件</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
</head>
<body class="hold-transition layout-fixed">
<div class="wrapper">
    <nav class="main-header navbar navbar-expand navbar-white navbar-light">
        <ul class="navbar-nav ml-auto">
            <li class="nav-item"><a class="nav-link" href="/dashboard.html"><i class="fas fa-arrow-left"></i> 返回控制台</a></li>
            <li class="nav-item"><a class="nav-link" href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> 退出</a></li>
        </ul>
    </nav>
    <aside class="main-sidebar sidebar-dark-primary elevation-4">
        <a href="/dashboard.html" class="brand-link"><span class="brand-text font-weight-light ml-3">稳站云</span></a>
        <div class="sidebar">
            <nav class="mt-2">
                <ul class="nav nav-pills nav-sidebar flex-column">
                    <li class="nav-item"><a href="/dashboard.html" class="nav-link"><i class="nav-icon fas fa-tachometer-alt"></i><p>控制台</p></a></li>
                    <li class="nav-item"><a href="/upload.html" class="nav-link active"><i class="nav-icon fas fa-upload"></i><p>上传文件</p></a></li>
                </ul>
            </nav>
        </div>
    </aside>
    <div class="content-wrapper">
        <section class="content-header"><div class="container-fluid"><h1>上传文件</h1></div></section>
        <section class="content">
            <div class="card">
                <div class="card-body">
                    <input type="file" id="fileInput" multiple accept=".html,.js,.css,.png,.jpg,.jpeg,.gif,.svg,.json,.txt">
                    <button id="uploadBtn" class="btn btn-primary mt-3"><i class="fas fa-upload"></i> 开始上传</button>
                    <div id="uploadResult" class="mt-3"></div>
                </div>
            </div>
        </section>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
<script>
const token = localStorage.getItem('wzy_token');
if (!token) window.location.href = '/login.html';

$('#uploadBtn').on('click', async function() {
    const files = $('#fileInput')[0].files;
    if (files.length === 0) { alert('请选择文件'); return; }
    $('#uploadResult').html('<p class="text-info">上传中...</p>');
    let success = 0, fail = 0;
    for (let file of files) {
        try {
            const content = btoa(await file.text());
            const res = await fetch('/api/files/upload', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({ fileName: file.name, content: content })
            }).then(r => r.json());
            if (res.success) success++; else fail++;
        } catch(e) { fail++; }
    }
    $('#uploadResult').html('<p class="text-success">成功: ' + success + ', 失败: ' + fail + '</p>');
});

function logout() { localStorage.removeItem('wzy_token'); window.location.href = '/login.html'; }
</script>
</body>
</html>
