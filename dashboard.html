<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>稳站云 - 控制台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background: #f0f2f5; }
        .navbar-brand { font-weight: bold; color: #0066ff !important; }
        .logout-btn { background: #ff4d4f; border: none; color: white; padding: 6px 16px; border-radius: 6px; }
        .logout-btn:hover { background: #d9363e; }
        .stat-card { background: white; border-radius: 12px; padding: 1.5rem; box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin-bottom: 1rem; }
        .table th { border-top: none; color: #666; font-weight: 500; }
        .table td { vertical-align: middle; }
        .upload-btn { background: #0066ff; border: none; color: white; padding: 8px 24px; border-radius: 6px; }
        .upload-btn:hover { background: #0052cc; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html">稳站云</a>
            <button class="logout-btn" onclick="logout()">退出登录</button>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8">
                <div class="stat-card">
                    <h4>欢迎回来，<span id="usernameDisplay"></span></h4>
                    <p class="text-secondary mb-0">你的专属代码空间已就绪</p>
                </div>
                <div class="stat-card">
                    <h5><i class="bi bi-folder2-open"></i> 我的文件列表</h5>
                    <table class="table table-hover mt-3">
                        <thead>
                            <tr><th>文件名</th><th>操作</th></tr>
                        </thead>
                        <tbody id="fileList">
                            <tr><td colspan="2" class="text-center text-muted">加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card text-center">
                    <h5>存储空间</h5>
                    <div class="display-4 text-primary mb-2">100</div>
                    <p class="text-secondary">MB 可用空间</p>
                    <a href="upload.html" class="btn upload-btn">上传文件</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const username = localStorage.getItem('wzy_username');
        const token = localStorage.getItem('wzy_token');
        
        if (!username || !token) window.location.href = 'login.html';
        document.getElementById('usernameDisplay').innerText = username;

        async function loadFiles() {
            try {
                const res = await fetch(`https://api.github.com/repos/renjianzhan/wenzhanyun/contents/users/${username}`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                const files = await res.json();
                const tbody = document.getElementById('fileList');
                tbody.innerHTML = '';
                
                if (Array.isArray(files) && files.length > 0) {
                    files.forEach(f => {
                        if (f.name !== '.gitkeep') {
                            tbody.innerHTML += `<tr><td>${f.name}</td><td><a href="${f.html_url}" target="_blank" class="text-decoration-none" style="color:#0066ff;">查看</a></td></tr>`;
                        }
                    });
                    if (tbody.innerHTML === '') tbody.innerHTML = '<tr><td colspan="2" class="text-center text-muted">暂无文件，快去上传吧！</td></tr>';
                } else {
                    tbody.innerHTML = '<tr><td colspan="2" class="text-center text-muted">暂无文件，快去上传吧！</td></tr>';
                }
            } catch(e) {
                document.getElementById('fileList').innerHTML = '<tr><td colspan="2" class="text-center text-danger">获取文件列表失败</td></tr>';
            }
        }
        loadFiles();

        function logout() {
            localStorage.removeItem('wzy_username');
            localStorage.removeItem('wzy_token');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
