<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>稳站云 - 注册</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
</head>
<body class="hold-transition register-page">
<div class="register-box">
    <div class="card card-outline card-primary">
        <div class="card-header text-center"><h1><b>稳站云</b></h1></div>
        <div class="card-body">
            <p class="login-box-msg">注册免费 100MB 托管空间</p>
            <form id="regForm">
                <div class="input-group mb-3">
                    <input type="text" id="regUser" class="form-control" placeholder="用户名">
                    <div class="input-group-append"><div class="input-group-text"><i class="fas fa-user"></i></div></div>
                </div>
                <div class="input-group mb-3">
                    <input type="password" id="regPass" class="form-control" placeholder="密码">
                    <div class="input-group-append"><div class="input-group-text"><i class="fas fa-lock"></i></div></div>
                </div>
                <button type="submit" class="btn btn-primary btn-block">注册</button>
            </form>
            <p class="mt-3 text-center">已有账号？<a href="/login.html">去登录</a></p>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script>
$('#regForm').on('submit', async (e) => {
    e.preventDefault();
    const res = await fetch('/api/user/register', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ username: $('#regUser').val(), password: $('#regPass').val() })
    }).then(r => r.json());
    if (res.success) {
        alert('注册成功！请登录');
        window.location.href = '/login.html';
    } else {
        alert(res.error || '注册失败');
    }
});
</script>
</body>
</html>
